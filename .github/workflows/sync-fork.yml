name: sync-fork

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync "${{ github.repository }}" -b master
